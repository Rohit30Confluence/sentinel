[project]
name = "sentinel"
version = "0.2.0"
description = "Async reconnaissance framework with global concurrency and rate control"
authors = [{ name = "DrConfluence" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9.0"
]

[project.scripts]
sentinel = "cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
